name: Weekly KPI Report

on:
  schedule:
    # 14:00 UTC every Monday = 6am Pacific Daylight Time / 7am Pacific Standard Time.
    # Always still "Monday morning" in Pacific either way cron itself is UTC-only and
    # does not adjust for daylight saving, but the script computes its own "today"
    # in Pacific time regardless of what UTC hour it actually runs at, so this only
    # needs to land comfortably within Monday Pacific - it does not need to be exact.
    - cron: '12 12 * * 1'
  workflow_dispatch:
    inputs:
      as_of_date:
        description: >
          Optional: run the report as if this were "today" (format YYYY-MM-DD).
          Drives the Prior 7 Days window — useful for backfilling a missed week
          or checking a past week's numbers. Leave blank for a normal current-week run.
        required: false
        default: ''
      mtd_as_of_date:
        description: >
          Optional: format YYYY-MM-DD. Independently controls which month the
          MTD/Plan/YTD/Trend sections show (separate from as_of_date above).
          Leave blank to have it just follow as_of_date (normal behavior) —
          only set this when you want Prior 7 Days and MTD to reflect two
          different months in the same run.
        required: false
        default: ''

permissions:
  contents: write   # needed so the job can commit index.html back to this repo

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for PDF export)
        run: python -m playwright install --with-deps chromium

      - name: Run weekly KPI report
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          REPORT_AS_OF_DATE: ${{ github.event.inputs.as_of_date }}
          REPORT_MTD_AS_OF_DATE: ${{ github.event.inputs.mtd_as_of_date }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          REPORT_LIVE_URL: ${{ secrets.REPORT_LIVE_URL }}
        run: python weekly_kpi_report.py

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history/ data/ latest_report.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly KPI dashboard update - $(date -u +'%Y-%m-%d')"
            git push
          fi
